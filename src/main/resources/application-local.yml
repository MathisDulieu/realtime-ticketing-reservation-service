# Server
server:
  port: 8083

# Spring
spring:
  kafka:
    bootstrap-servers: localhost:9092

# Logging
logging:
  level:
    root: INFO
    com.mathisdulieu.ticketing: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){blue} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n"

# CORS
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

reservation:
  mongodb:
    uri: mongodb://localhost:27017
    database-name: reservation-service
