# Server
server:
  port: 0

# Spring
spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
  main:
    allow-bean-definition-overriding: true

# Logging
logging:
  level:
    root: WARN
    com.mathisdulieu.ticketing: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS
cors:
  allowed-origins:
    - "http://localhost:3000"

reservation:
  mongodb:
    uri: mongodb://localhost:27017
    database-name: reservation-service-test
